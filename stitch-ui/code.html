<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>

<title>NightCheck - Check-in</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Manrope:wght@600;700&amp;display=swap" rel="stylesheet"/>

<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

                        "on-primary-container": "#e0d2ff",

                        "error-container": "#93000a",
                        "on-primary-fixed": "#22005d",
                        "surface-container-lowest": "#0f0d13",
                        "on-error-container": "#ffdad6",

                        "on-surface": "#e6e0e9",

<style>
        body {
            background: linear-gradient(135deg, #0F172A 0%, #1E293B 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Glassmorphism Utilities */
        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            border-left: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }

        .glass-button {
            background: rgba(16, 185, 129, 0.2);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(16, 185, 129, 0.4);
            box-shadow: 0 4px 16px rgba(16, 185, 129, 0.15), inset 0 2px 4px rgba(255,255,255,0.1);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .glass-button:hover, .glass-button:active {
            background: rgba(16, 185, 129, 0.3);
            box-shadow: 0 4px 20px rgba(16, 185, 129, 0.3), inset 0 2px 4px rgba(255,255,255,0.2);
        }

        .emerald-glow {
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.2);
        }

        .emerald-glow-strong {
            box-shadow: 0 0 30px rgba(16, 185, 129, 0.4);
        }

        /* Embossed Disc */
        .embossed-disc {
            background: linear-gradient(145deg, #222f43, #1c2738);
            box-shadow: 20px 20px 60px #131b26, -20px -20px 60px #293950, inset 0 2px 10px rgba(255,255,255,0.05);
        }

        .embossed-inner {
            background: #1e293b;
            box-shadow: inset 5px 5px 10px #131b26, inset -5px -5px 10px #293950;
        }

        /* Animations */
        @keyframes pulse-ring {
            0% { transform: scale(0.95); opacity: 0.5; box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { transform: scale(1); opacity: 0.8; box-shadow: 0 0 0 20px rgba(16, 185, 129, 0); }
            100% { transform: scale(0.95); opacity: 0.5; box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }

        .animate-pulse-ring {
            animation: pulse-ring 2s infinite cubic-bezier(0.4, 0, 0.2, 1);
        }

        .pb-safe { padding-bottom: env(safe-area-inset-bottom); }
        .pt-safe { padding-top: env(safe-area-inset-top); }
    </style>
</head>
<body class="text-on-surface antialiased pt-safe pb-safe selection:bg-primary/30">
<!-- TopAppBar -->
<header class="flex items-center justify-between px-container-margin-mobile h-16 w-full z-50 bg-surface/70 backdrop-blur-xl border-b border-white/10 shadow-sm fixed top-0 transition-all duration-300">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">security</span>
<span class="font-headline-md text-headline-md text-primary tracking-tight">NightCheck</span>
</div>
<div class="w-8 h-8 rounded-full overflow-hidden border border-white/20 bg-surface-variant flex items-center justify-center">
<span class="material-symbols-outlined text-sm text-on-surface-variant">person</span>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col items-center justify-center px-container-margin-mobile pt-24 pb-24 relative overflow-hidden">
<!-- Background Decor -->
<div class="absolute inset-0 z-0 pointer-events-none flex items-center justify-center">
<div class="w-[300px] h-[300px] bg-[#10B981] rounded-full blur-[120px] opacity-10"></div>
</div>
<!-- Content Container -->
<div class="relative z-10 flex flex-col items-center w-full max-w-md gap-stack-lg">
<!-- Banner Pill -->
<div class="glass-panel rounded-full px-6 py-2 flex items-center gap-2 emerald-glow">
<span class="material-symbols-outlined text-[#10B981] text-sm" style="font-variation-settings: 'FILL' 1;">schedule</span>
<span class="font-label-sm text-label-sm text-[#10B981] uppercase tracking-wider">Check-in open until 9:00 PM</span>
</div>
<!-- Fingerprint Area -->
<div class="flex flex-col items-center gap-stack-sm my-stack-lg">
<div class="w-48 h-48 rounded-full embossed-disc flex items-center justify-center p-4 relative group cursor-pointer transition-transform duration-300 active:scale-95">
<div class="absolute inset-0 rounded-full animate-pulse-ring border-2 border-[#10B981]/20"></div>
<div class="w-full h-full rounded-full embossed-inner flex items-center justify-center relative overflow-hidden">
<div class="absolute inset-0 bg-gradient-to-b from-transparent to-[#10B981]/10 opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>
<span class="material-symbols-outlined text-[80px] text-on-surface/80 group-hover:text-[#10B981] transition-colors duration-300 relative z-10" style="font-variation-settings: 'FILL' 0; font-weight: 200;">fingerprint</span>
</div>
</div>
<p class="font-body-md text-body-md text-on-surface-variant mt-4">Touch sensor to verify</p>
</div>
<!-- Location Status Card -->
<div class="w-full glass-panel rounded-xl p-4 flex items-center justify-between border border-[#10B981]/20">
<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-full bg-[#10B981]/10 flex items-center justify-center border border-[#10B981]/30">
<span class="material-symbols-outlined text-[#10B981] text-sm" style="font-variation-settings: 'FILL' 1;">location_on</span>
</div>
<div>
<p class="font-label-md text-label-md text-on-surface">Location Verified</p>
<p class="font-label-sm text-label-sm text-on-surface-variant normal-case tracking-normal">Inside hostel boundary</p>
</div>
</div>
<div class="w-6 h-6 rounded-full bg-[#10B981] flex items-center justify-center shadow-lg">
<span class="material-symbols-outlined text-surface text-xs" style="font-variation-settings: 'FILL' 1; font-weight: 800;">check</span>
</div>
</div>
<!-- Action Button -->
<div class="w-full mt-4">
<button class="w-full h-14 rounded-full glass-button font-headline-md text-headline-md text-white flex items-center justify-center gap-2">
<span>Check In Now</span>
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">arrow_forward</span>
</button>
</div>
</div>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 py-3 pb-safe bg-surface-container/80 backdrop-blur-xl border-t border-white/10 shadow-lg rounded-t-xl md:hidden">
<!-- Active Tab: Check-in -->
<a class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-full px-4 py-1 transition-transform duration-200 active:scale-90" href="#">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">fingerprint</span>
<span class="font-label-sm text-label-sm mt-1">Check-in</span>
</a>
<!-- Inactive Tab: History -->
<a class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-white/5 rounded-xl px-3 py-1 transition-transform duration-200 active:scale-90" href="#">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">history</span>
<span class="font-label-sm text-label-sm mt-1">History</span>
</a>
<!-- Inactive Tab: Map -->
<a class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-white/5 rounded-xl px-3 py-1 transition-transform duration-200 active:scale-90" href="#">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">location_on</span>
<span class="font-label-sm text-label-sm mt-1">Map</span>
</a>
<!-- Inactive Tab: Settings -->
<a class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-white/5 rounded-xl px-3 py-1 transition-transform duration-200 active:scale-90" href="#">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">settings</span>
<span class="font-label-sm text-label-sm mt-1">Settings</span>
</a>
</nav>
</body></html>
